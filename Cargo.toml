[workspace]
resolver = "3"
members = ["crates/wpk", "crates/libwpk", "crates/wpk-shim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/OrkWard/winpkgs"

[workspace.dependencies]
libwpk = { path = "crates/libwpk" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.2"

[profile.release]
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1
