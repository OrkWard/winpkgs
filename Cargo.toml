[workspace]
resolver = "3"
members = ["crates/wpk", "crates/libwpk", "crates/wpk-shim"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/OrkWard/winpkgs"

[workspace.dependencies]
libwpk = { path = "crates/libwpk" }
wpk-shim = { path = "crates/wpk-shim" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = [
    "blocking-http-transport-curl",
    "max-performance",
    "sha1",
] }
curl = { version = "0.4", features = ["static-curl"] }
md5 = { package = "md-5", version = "0.11" }
jiff = { version = "0.2", features = ["serde"] }
junction = "2.1"
sha1 = "0.11"
sha2 = "0.11"
remove_dir_all = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.2"
windows = "0.62"
windows-sys = "0.61"
zip = { version = "9.5", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "deflate64",
    "lzma",
] }

[profile.release]
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1
